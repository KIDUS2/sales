spring:
  datasource:
    # Addis Ababa time, so "today" in reports matches the shop's day
    url: jdbc:postgresql://localhost:5432/salesdb?options=-c%20TimeZone=Africa/Addis_Ababa
    username: postgres
    password: postgres
  jpa:
    open-in-view: false
    hibernate.ddl-auto: none      # tables are managed by Flyway
    properties.hibernate.jdbc.time_zone: UTC
server:
  port: 8080
